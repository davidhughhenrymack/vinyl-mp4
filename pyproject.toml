[project]
name = "vinyl-mp4"
version = "0.1.0"
description = "Convert MP3 files to MP4 videos with audio-reactive vinyl visualization"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "moderngl>=5.8",
    "numpy>=1.24",
    "scipy>=1.11",
    "pydub>=0.25",
    "mutagen>=1.46",
    "pillow>=10.0",
    "audioop-lts>=0.2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[project.scripts]
vinyl-mp4 = "vinyl_mp4.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_mp4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
